name: Générer APK AMASA Academy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Installer les dépendances
        run: npm install
      - name: Créer le projet Android
        run: npx cap add android
      - name: Installer les icônes officielles AMASA
        run: cp -R android-res/. android/app/src/main/res/
      - name: Synchroniser les fichiers web
        run: npx cap sync android
      - name: Compiler l'APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: AMASA-Academy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
